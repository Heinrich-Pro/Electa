{% load static %}
<!DOCTYPE html>
<html lang="fr">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Résultats Élections{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'elections/css/style.css' %}" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🗳️ Résultats des Élections</h1>

      <nav>

        >
        <a href="{% url 'elections:resultats_par_centre' %}">🏢 Par Centre de Vote</a>
        <a href="{% url 'elections:resultats_par_bureau' %}">🗳️ Par Bureau de Vote</a>
        <a href="{% url 'elections:dashboard' %}">🚀 Tableau de Bord</a>
      </nav>

      <div class="content">{% block content %}{% endblock %}</div>
    </div>
  </body>
</html>
