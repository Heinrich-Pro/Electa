{% extends 'elections/base.html' %}

{% block content %}
<div class="row" style="display: flex; justify-content: center;">
    <div class="col-md-6" style="width: 100%; max-width: 600px;">
        <div class="stat-card" style="margin-bottom: 20px;">
            <h2>{{ titre }}</h2>
        </div>

        <div class="centre-section">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                
                {% for field in form %}
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #333;">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div style="color: red; font-size: 0.9em; margin-top: 5px;">{{ field.errors }}</div>
                    {% endif %}
                </div>
                {% endfor %}

                <div style="margin-top: 20px; display: flex; gap: 10px;">
                    <a href="javascript:history.back()" class="stat-card" style="flex: 1; background: #6c757d; text-decoration: none; font-size: 1em; padding: 15px;">
                        Annuler
                    </a>
                    <button type="submit" class="stat-card" style="flex: 2; border: none; cursor: pointer; font-size: 1em; background: linear-gradient(135deg, #28a745 0%, #20c997 100%); padding: 15px;">
                        Enregistrer
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    input[type="text"], input[type="number"], textarea, select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 16px;
    }
</style>
{% endblock %}
